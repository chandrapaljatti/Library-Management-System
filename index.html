<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKWORLD – Smart Library Management System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="app">
        <!-- Main Navigation / Sidebar will be injected here -->
        <aside id="sidebar" class="hidden">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon"><i class="fas fa-book-open"></i></span>
                    <span class="logo-text">BOOK<span>WORLD</span></span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Nav items dynamically injected based on role -->
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <div class="user-details">
                        <p class="user-name" id="sidebar-user-name">Guest</p>
                        <p class="user-role" id="sidebar-user-role">Visitor</p>
                    </div>
                </div>
                <button id="logout-btn" class="logout-btn" onclick="auth.logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main id="main-content" class="no-sidebar">
            <!-- Pages will be rendered here -->
            <section id="landing-page" class="active">
                <div class="hero">
                    <h1>Welcome to <span>BOOKWORLD</span></h1>
                    <p>Experience the next generation of library management.</p>
                    <div class="auth-buttons">
                        <button class="btn btn-primary" onclick="showPage('student-login')">Student Portal</button>
                        <button class="btn btn-secondary" onclick="showPage('librarian-login')">Librarian
                            Access</button>
                    </div>
                </div>
            </section>

            <!-- Auth Sections -->
            <section id="student-login" class="hidden auth-section">
                <!-- Content via JS -->
            </section>

            <section id="student-signup" class="hidden auth-section">
                <!-- Content via JS -->
            </section>

            <section id="librarian-login" class="hidden auth-section">
                <!-- Content via JS -->
            </section>

            <!-- Dashboard Sections -->
            <section id="student-dashboard" class="hidden dashboard-section">
                <!-- Content via JS -->
            </section>

            <section id="librarian-dashboard" class="hidden dashboard-section">
                <!-- Content via JS -->
            </section>
        </main>

        <!-- Overlay Components -->
        <div id="toast-container"></div>
        <div id="modal-container" class="hidden"></div>
        <div id="loader" class="hidden">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="js/supabase.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/services/books.js"></script>
    <script src="js/services/users.js"></script>
    <script src="js/services/transactions.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
